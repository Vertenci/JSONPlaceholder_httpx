services:
  web:
    build: .
    container_name: jsonplaceholder_httpx_app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
    networks:
      - app_network
    deploy:
      resources:
        limits:
          cpus: '12.0'
          memory: 8G
        reservations:
          cpus: '4.0'
          memory: 2G

  db:
    image: postgres:16
    container_name: postgres_db_jsonplaceholder_httpx
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    command: >
      postgres
      -c max_connections=800
      -c shared_buffers=6GB
      -c effective_cache_size=16GB
      -c maintenance_work_mem=1GB
      -c work_mem=128MB
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c wal_buffers=64MB
      -c max_wal_size=4GB
      -c min_wal_size=2GB
      -c checkpoint_completion_target=0.9
      -c default_statistics_target=100
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app_network
    deploy:
      resources:
        limits:
          cpus: '8.0'
          memory: 12G
        reservations:
          cpus: '2.0'
          memory: 4G

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin_httpx
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
    ports:
      - "5050:80"
    depends_on:
      - db
    networks:
      - app_network
    profiles:
      - dev
      - tools
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  locust-master:
    image: locustio/locust
    container_name: locust_master
    ports:
      - "8089:8089"
    volumes:
      - ./locustfile.py:/mnt/locust/locustfile.py
    command: >
      -f /mnt/locust/locustfile.py
      --host=http://web:8000
      --master
    depends_on:
      - web
    networks:
      - app_network
    profiles:
      - dev
      - loadtest
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G

  locust-worker:
    image: locustio/locust
    volumes:
      - ./locustfile.py:/mnt/locust/locustfile.py
    command: >
      -f /mnt/locust/locustfile.py
      --worker
      --master-host=locust-master
    depends_on:
      - locust-master
    networks:
      - app_network
    profiles:
      - dev
      - loadtest
    deploy:
      replicas: 8
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

volumes:
  postgres_data:
    name: jsonplaceholder_httpx_postgres_data
  pgadmin_data:
    name: jsonplaceholder_httpx_pgadmin_data

networks:
  app_network:
    driver: bridge
